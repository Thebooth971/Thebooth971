name: Metrics

on:
  schedule:
    - cron: "0 * * * *"
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          user: Thebooth971
          token: ${{ secrets.METRICS_TOKEN }}
          base: header, activity, community, repositories, metadata
          config_timezone: America/Argentina/Buenos_Aires
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_fetch_all: yes
          plugin_habits_local: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_lines: yes
          plugin_lines_history: yes
          plugin_lines_languages: yes
          plugin_lines_languages_limit: 8
          plugin_peoples: yes
          plugin_peoples_limit: 8
          plugin_followup: yes
          plugin_starred: yes
          plugin_starred_limit: 8
          plugin_starred_from: starred
          plugin_starred_length: 600
          plugin_starred_threshold: 1
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_display: compact
          plugin_introduction: yes
          plugin_introduction_title: yes
          plugin_recent: yes
          plugin_recent_limit: 5
          plugin_recent_categories: repositories
